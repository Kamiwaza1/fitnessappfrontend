stages:
  - test
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - node -v
  - npm -v
  - npm ci --cache .npm --prefer-offline

test:
  stage: test
  script:
    - npm run test -- --run
  allow_failure: true

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week