stages:
  - test
  - build

cache:
  key: npm-cache
  paths:
    - node_modules/

before_script:
  - node -v
  - npm -v
  - npm ci

test:
  stage: test
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 1 week

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week